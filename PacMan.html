<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'Courier New',monospace;
    user-select:none;
    overflow:hidden;
}
canvas { display:block; }
#ui {
    width:560px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 10px;
    background:#000;
    color:#fff;
    font-size:13px;
    font-family:'Courier New',monospace;
}
#score-display { color:#ffdd00; font-weight:bold; }
#hi-display    { color:#aaaaff; font-weight:bold; }
#lives-display { color:#ffdd00; font-weight:bold; }
#level-display { color:#44ffaa; font-weight:bold; }
.label { color:#aaa; }
</style>
</head>
<body>
<div id="ui">
    <span><span class="label">SCORE </span><span id="score-display">0</span></span>
    <span><span class="label">HI </span><span id="hi-display">0</span></span>
    <span><span class="label">LIVES </span><span id="lives-display">3</span></span>
    <span><span class="label">LEVEL </span><span id="level-display">1</span></span>
</div>
<canvas id="c" width="560" height="620"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 560, H = 620;

const scoreEl = document.getElementById('score-display');
const hiEl    = document.getElementById('hi-display');
const livesEl = document.getElementById('lives-display');
const levelEl = document.getElementById('level-display');

// ── Maze definition (28×31 tiles) ──────────────────────────────────────────
// 0=empty, 1=wall, 2=pellet, 3=power pellet, 4=ghost house door
const COLS = 28, ROWS = 31;
const TS = 20; // tile size px

const MAZE_TEMPLATE = [
    '1111111111111111111111111111',
    '1222222222222112222222222221',
    '1211112111112112111121111121',
    '1311112111112112111121111131',
    '1211112111112112111121111121',
    '1222222222222222222222222221',
    '1211112112111111112112111121',
    '1211112112111111112112111121',
    '1222222112222112222112222221',
    '1111112111110110111111211111',
    '1111112111110110111111211111',
    '1111112110000000001112211111',
    '1111112110111411110112211111',
    '0000002110100000010112200000',
    '1111112110100000010112211111',
    '1111112110000000001112211111',
    '1111112110111111110112211111',
    '1111112110000000001112211111',
    '1111112112111111112112111111',
    '1222222222222112222222222221',
    '1211112111112112111121111121',
    '1211112111112112111121111121',
    '1322112222222002222222113221',
    '1112112112111111112112112111',
    '1112112112111111112112112111',
    '1222222112222112222112222221',
    '1211111111112112111111111121',
    '1211111111112112111111111121',
    '1222222222222222222222222221',
    '1111111111111111111111111111',
    '0000000000000000000000000000',
];

let maze = [];
let totalPellets = 0;

function buildMaze() {
    maze = [];
    totalPellets = 0;
    for (let r = 0; r < ROWS; r++) {
        maze[r] = [];
        for (let c = 0; c < COLS; c++) {
            const ch = MAZE_TEMPLATE[r][c];
            const v = parseInt(ch);
            maze[r][c] = v;
            if (v === 2 || v === 3) totalPellets++;
        }
    }
}

function tileX(c) { return c * TS; }
function tileY(r) { return r * TS; }
function tileAt(r, c) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return 1;
    return maze[r][c];
}
function isWall(r, c) { return tileAt(r, c) === 1 || tileAt(r, c) === 4; }

// ── State ───────────────────────────────────────────────────────────────────
let state = 'title';
let score = 0, hiScore = 0, lives = 3, level = 1;
let pelletsEaten = 0;
let frameCount = 0;
let powerTimer = 0;  // frames of frightened mode remaining
let ghostEatCombo = 0;
let deathTimer = 0;
let levelTimer = 0;

// ── Pac-Man ─────────────────────────────────────────────────────────────────
let pac = { r:23, c:14, x:0, y:0, dx:0, dy:0, nextDx:0, nextDy:0, mouthAngle:0.25, mouthDir:1 };

function pacReset() {
    pac.r = 23; pac.c = 14;
    pac.x = tileX(pac.c) + TS/2;
    pac.y = tileY(pac.r) + TS/2;
    pac.dx = 0; pac.dy = 0;
    pac.nextDx = -1; pac.nextDy = 0;
    pac.mouthAngle = 0.25;
}

// ── Ghosts ──────────────────────────────────────────────────────────────────
const GHOST_COLORS = ['#ff0000','#ffb8ff','#00ffff','#ffb852'];
const GHOST_NAMES  = ['Blinky','Pinky','Inky','Clyde'];

// Ghost scatter targets (tile corners)
const SCATTER_TARGETS = [
    { r:0,  c:25 }, // Blinky — top right
    { r:0,  c:2  }, // Pinky  — top left
    { r:30, c:27 }, // Inky   — bottom right
    { r:30, c:0  }, // Clyde  — bottom left
];

// Ghost house exit positions
const HOUSE_EXIT = { r:11, c:14 };

let ghosts = [];

function ghostReset() {
    ghosts = [
        { r:11, c:14, x:0, y:0, dx:0, dy:-1, mode:'scatter', scatter:0, eaten:false, exitDelay:0,  name:'Blinky' },
        { r:13, c:13, x:0, y:0, dx:1, dy:0,  mode:'house',   scatter:0, eaten:false, exitDelay:60, name:'Pinky'  },
        { r:13, c:14, x:0, y:0, dx:-1,dy:0,  mode:'house',   scatter:0, eaten:false, exitDelay:120,name:'Inky'   },
        { r:13, c:15, x:0, y:0, dx:1, dy:0,  mode:'house',   scatter:0, eaten:false, exitDelay:200,name:'Clyde'  },
    ];
    for (let i = 0; i < 4; i++) {
        ghosts[i].x = tileX(ghosts[i].c) + TS/2;
        ghosts[i].y = tileY(ghosts[i].r) + TS/2;
        ghosts[i].color = GHOST_COLORS[i];
        ghosts[i].exitTimer = 0;
    }
}

// ── Input ───────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if ((state === 'title' || state === 'gameover') &&
        (e.code === 'Space' || e.code === 'Enter')) startGame();
    if (e.code === 'ArrowLeft')  { pac.nextDx = -1; pac.nextDy = 0; }
    if (e.code === 'ArrowRight') { pac.nextDx =  1; pac.nextDy = 0; }
    if (e.code === 'ArrowUp')    { pac.nextDx =  0; pac.nextDy = -1; }
    if (e.code === 'ArrowDown')  { pac.nextDx =  0; pac.nextDy =  1; }
    e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function rand(a,b) { return a + Math.random()*(b-a); }
function randi(a,b) { return Math.floor(rand(a,b+1)); }

// ── Init ────────────────────────────────────────────────────────────────────
function startGame() {
    state = 'playing';
    score = 0; lives = 3; level = 1;
    buildMaze();
    pacReset();
    ghostReset();
    pelletsEaten = 0;
    powerTimer = 0;
    ghostEatCombo = 0;
    frameCount = 0;
    updateUI();
}

function nextLevel() {
    level++;
    buildMaze();
    pacReset();
    ghostReset();
    pelletsEaten = 0;
    powerTimer = 0;
    ghostEatCombo = 0;
    levelTimer = 120;
    updateUI();
}

// ── Pac-Man movement ────────────────────────────────────────────────────────
const PAC_SPEED = 1.5;

function updatePac() {
    if (levelTimer > 0) { levelTimer--; return; }

    // Mouth animation
    pac.mouthAngle += 0.05 * pac.mouthDir;
    if (pac.mouthAngle >= 0.25) pac.mouthDir = -1;
    if (pac.mouthAngle <= 0)    pac.mouthDir =  1;

    // Try queued direction
    const nr = pac.r + pac.nextDy;
    const nc = pac.c + pac.nextDx;
    if (!isWall(nr, nc)) {
        pac.dx = pac.nextDx;
        pac.dy = pac.nextDy;
    }

    // Move
    const nx = pac.x + pac.dx * PAC_SPEED;
    const ny = pac.y + pac.dy * PAC_SPEED;

    // Snap to grid when crossing tile centre
    const snapR = Math.round((ny - TS/2) / TS);
    const snapC = Math.round((nx - TS/2) / TS);

    if (!isWall(snapR, snapC + pac.dx) || !isWall(snapR + pac.dy, snapC)) {
        pac.x = nx;
        pac.y = ny;
    }

    // Tunnel wrap
    if (pac.x < 0)   pac.x = W;
    if (pac.x > W)   pac.x = 0;

    pac.r = Math.round((pac.y - TS/2) / TS);
    pac.c = Math.round((pac.x - TS/2) / TS);
    pac.r = Math.max(0, Math.min(ROWS-1, pac.r));
    pac.c = ((pac.c % COLS) + COLS) % COLS;

    // Eat pellet
    const tile = maze[pac.r]?.[pac.c];
    if (tile === 2) {
        maze[pac.r][pac.c] = 0;
        score += 10; pelletsEaten++;
        updateUI();
    } else if (tile === 3) {
        maze[pac.r][pac.c] = 0;
        score += 50; pelletsEaten++;
        powerTimer = 300 - level * 20;
        ghostEatCombo = 0;
        updateUI();
    }

    if (pelletsEaten >= totalPellets) {
        state = 'levelclear';
        levelTimer = 120;
    }
}

// ── Ghost AI ─────────────────────────────────────────────────────────────────
const GHOST_SPEED = 1.2;

function ghostTarget(g, idx) {
    if (g.mode === 'frightened') return { r: randi(0, ROWS-1), c: randi(0, COLS-1) };
    if (g.mode === 'scatter')    return SCATTER_TARGETS[idx];
    // Chase
    if (idx === 0) return { r: pac.r, c: pac.c }; // Blinky: direct chase
    if (idx === 1) return { r: pac.r + pac.dy*4, c: pac.c + pac.dx*4 }; // Pinky: 4 ahead
    if (idx === 2) { // Inky: vector trick
        const t = { r: pac.r + pac.dy*2, c: pac.c + pac.dx*2 };
        const b = ghosts[0];
        return { r: t.r + (t.r - b.r), c: t.c + (t.c - b.c) };
    }
    // Clyde: chase if far, scatter if close
    const dr = pac.r - g.r, dc = pac.c - g.c;
    return (Math.sqrt(dr*dr+dc*dc) > 8) ? { r: pac.r, c: pac.c } : SCATTER_TARGETS[3];
}

function updateGhost(g, idx) {
    if (g.eaten) {
        // Return to house
        g.mode = 'returning';
    }

    if (g.mode === 'house') {
        g.exitTimer++;
        if (g.exitTimer >= g.exitDelay) {
            g.mode = 'scatter';
            g.r = HOUSE_EXIT.r; g.c = HOUSE_EXIT.c;
            g.x = tileX(g.c)+TS/2; g.y = tileY(g.r)+TS/2;
            g.dx = 0; g.dy = -1;
        }
        // Bounce in house
        g.y += g.dy * 0.5;
        if (g.y < tileY(12)+TS/2 || g.y > tileY(14)+TS/2) g.dy *= -1;
        return;
    }

    // Update mode based on power timer
    if (powerTimer > 0) {
        if (g.mode !== 'frightened' && g.mode !== 'returning') {
            g.mode = 'frightened';
            // Reverse direction
            g.dx *= -1; g.dy *= -1;
        }
    } else {
        if (g.mode === 'frightened') {
            g.mode = 'scatter';
            g.scatter = 0;
        }
    }

    if (g.mode === 'scatter') {
        g.scatter++;
        if (g.scatter > 300) { g.mode = 'chase'; g.scatter = 0; }
    }

    // Returning to house
    if (g.mode === 'returning') {
        const dr = HOUSE_EXIT.r - g.r, dc = HOUSE_EXIT.c - g.c;
        if (Math.abs(dr) + Math.abs(dc) < 1) {
            g.eaten = false;
            g.mode = 'scatter';
            g.scatter = 0;
        }
    }

    // Move toward target tile
    const speed = g.mode === 'frightened' ? GHOST_SPEED * 0.6
                : g.mode === 'returning'  ? GHOST_SPEED * 2
                : GHOST_SPEED;

    const target = ghostTarget(g, idx);

    // At tile centre — choose direction
    const cx = tileX(g.c) + TS/2;
    const cy = tileY(g.r) + TS/2;
    if (Math.abs(g.x - cx) < speed && Math.abs(g.y - cy) < speed) {
        g.x = cx; g.y = cy;
        // Pick best direction not reversing
        const dirs = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
        let best = null, bestDist = Infinity;
        for (const d of dirs) {
            if (d.dx === -g.dx && d.dy === -g.dy) continue; // no reverse
            const nr = g.r + d.dy, nc = g.c + d.dx;
            if (isWall(nr, nc)) continue;
            if (g.mode !== 'returning' && tileAt(nr, nc) === 4) continue; // can't enter house normally
            const ddr = target.r - nr, ddc = target.c - nc;
            const dist = g.mode === 'frightened' ? Math.random()
                       : Math.sqrt(ddr*ddr + ddc*ddc);
            if (dist < bestDist) { bestDist = dist; best = d; }
        }
        if (best) { g.dx = best.dx; g.dy = best.dy; }
    }

    g.x += g.dx * speed;
    g.y += g.dy * speed;

    // Tunnel wrap
    if (g.x < 0) g.x = W;
    if (g.x > W) g.x = 0;

    g.r = Math.round((g.y - TS/2) / TS);
    g.c = Math.round((g.x - TS/2) / TS);
    g.r = Math.max(0, Math.min(ROWS-1, g.r));
    g.c = ((g.c % COLS) + COLS) % COLS;
}

function checkGhostCollisions() {
    for (const g of ghosts) {
        if (g.eaten || g.mode === 'house') continue;
        const dx = pac.x - g.x, dy = pac.y - g.y;
        if (Math.sqrt(dx*dx+dy*dy) < TS * 0.8) {
            if (g.mode === 'frightened') {
                g.eaten = true;
                ghostEatCombo++;
                const pts = [200,400,800,1600][Math.min(ghostEatCombo-1,3)];
                score += pts;
                updateUI();
            } else if (g.mode !== 'returning') {
                // Hit!
                lives--;
                updateUI();
                if (lives <= 0) {
                    state = 'gameover';
                    if (score > hiScore) hiScore = score;
                    updateUI();
                } else {
                    state = 'dead';
                    deathTimer = 120;
                    pacReset();
                    ghostReset();
                    powerTimer = 0;
                }
                return;
            }
        }
    }
}

// ── Drawing ──────────────────────────────────────────────────────────────────
function drawMaze() {
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const t = maze[r][c];
            const tx = tileX(c), ty = tileY(r);
            if (t === 1) {
                ctx.fillStyle = '#1a1aff';
                ctx.fillRect(tx, ty, TS, TS);
                // Inner highlight
                ctx.fillStyle = '#3333ff';
                ctx.fillRect(tx+1, ty+1, TS-2, TS-2);
                ctx.fillStyle = '#0000cc';
                ctx.fillRect(tx+2, ty+2, TS-4, TS-4);
            } else if (t === 2) {
                ctx.fillStyle = '#ffdd88';
                ctx.beginPath();
                ctx.arc(tx+TS/2, ty+TS/2, 2, 0, Math.PI*2);
                ctx.fill();
            } else if (t === 3) {
                const flash = Math.floor(frameCount/15)%2;
                ctx.fillStyle = flash ? '#fff' : '#ffdd00';
                ctx.beginPath();
                ctx.arc(tx+TS/2, ty+TS/2, 5, 0, Math.PI*2);
                ctx.fill();
            } else if (t === 4) {
                ctx.fillStyle = '#ff88aa';
                ctx.fillRect(tx+2, ty+TS/2-1, TS-4, 2);
            }
        }
    }
}

function drawPac() {
    const angle = pac.mouthAngle * Math.PI;
    let startAngle = angle;
    // Rotate mouth based on direction
    const facingAngle = pac.dx === 1 ? 0 : pac.dx === -1 ? Math.PI
                      : pac.dy === -1 ? -Math.PI/2 : Math.PI/2;
    ctx.fillStyle = '#ffdd00';
    ctx.beginPath();
    ctx.moveTo(pac.x, pac.y);
    ctx.arc(pac.x, pac.y, TS/2 - 1, facingAngle + angle, facingAngle + Math.PI*2 - angle);
    ctx.closePath();
    ctx.fill();
}

function drawGhost(g) {
    const frightEnd = powerTimer < 80 && powerTimer > 0;
    let col;
    if (g.eaten) col = '#aaa';
    else if (g.mode === 'frightened') col = frightEnd && Math.floor(frameCount/8)%2 ? '#fff' : '#0000cc';
    else col = g.color;

    const r = TS/2 - 1;
    const x = g.x, y = g.y;

    ctx.fillStyle = col;
    // Body
    ctx.beginPath();
    ctx.arc(x, y - r*0.1, r, Math.PI, 0);
    ctx.lineTo(x+r, y+r);
    // Wavy bottom
    const segs = 3;
    for (let i = segs; i >= 0; i--) {
        const sx = x - r + (2*r/segs)*i;
        const sy = y + r - (i%2 === 0 ? 0 : r*0.4);
        ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.fill();

    // Eyes (skip if eaten/frightened)
    if (!g.eaten && g.mode !== 'frightened') {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(x-r*0.3, y-r*0.15, r*0.3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+r*0.3, y-r*0.15, r*0.3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#00f';
        ctx.beginPath(); ctx.arc(x-r*0.3+g.dx*r*0.15, y-r*0.15+g.dy*r*0.15, r*0.15, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+r*0.3+g.dx*r*0.15, y-r*0.15+g.dy*r*0.15, r*0.15, 0, Math.PI*2); ctx.fill();
    } else if (g.eaten) {
        // Just eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(x-r*0.3, y, r*0.3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+r*0.3, y, r*0.3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#00f';
        ctx.beginPath(); ctx.arc(x-r*0.3, y, r*0.15, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+r*0.3, y, r*0.15, 0, Math.PI*2); ctx.fill();
    }
}

function drawLives() {
    for (let i = 0; i < lives - 1; i++) {
        const lx = 20 + i * 25, ly = H - 10;
        ctx.fillStyle = '#ffdd00';
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.arc(lx, ly, 8, 0.3, Math.PI*2 - 0.3);
        ctx.closePath();
        ctx.fill();
    }
}

function updateUI() {
    scoreEl.textContent = score;
    hiEl.textContent    = hiScore;
    livesEl.textContent = lives;
    levelEl.textContent = level;
}

function drawTitle() {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 52px Courier New';
    ctx.fillStyle = '#ffdd00';
    ctx.fillText('PAC-MAN', W/2, H/2 - 60);
    ctx.font = '15px Courier New';
    ctx.fillStyle = '#aaa';
    ctx.fillText('ARROW KEYS — move', W/2, H/2 + 10);
    ctx.fillText('Eat power pellets to hunt ghosts', W/2, H/2 + 35);
    ctx.font = 'bold 16px Courier New';
    ctx.fillStyle = Math.floor(frameCount/20)%2 ? '#fff' : '#666';
    ctx.fillText('PRESS SPACE TO START', W/2, H/2 + 80);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 36px Courier New';
    ctx.fillStyle = '#ff4444';
    ctx.fillText('GAME OVER', W/2, H/2 - 30);
    ctx.font = '18px Courier New';
    ctx.fillStyle = '#ffdd00';
    ctx.fillText('SCORE: ' + score, W/2, H/2 + 10);
    if (score >= hiScore && score > 0) { ctx.fillStyle = '#44ffaa'; ctx.fillText('NEW HIGH SCORE!', W/2, H/2 + 36); }
    ctx.font = 'bold 14px Courier New';
    ctx.fillStyle = Math.floor(frameCount/20)%2 ? '#fff' : '#666';
    ctx.fillText('PRESS SPACE TO PLAY AGAIN', W/2, H/2 + 76);
}

function drawLevelClear() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px Courier New';
    ctx.fillStyle = Math.floor(frameCount/10)%2 ? '#ffdd00' : '#fff';
    ctx.fillText('LEVEL CLEAR!', W/2, H/2);
}

// ── Main loop ────────────────────────────────────────────────────────────────
function loop() {
    requestAnimationFrame(loop);
    frameCount++;
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);

    if (state === 'title') {
        buildMaze();
        drawMaze();
        drawTitle();
        return;
    }

    drawMaze();

    if (state === 'playing') {
        if (powerTimer > 0) powerTimer--;
        updatePac();
        for (let i = 0; i < 4; i++) updateGhost(ghosts[i], i);
        checkGhostCollisions();
    }

    if (state === 'dead') {
        deathTimer--;
        if (deathTimer <= 0) state = 'playing';
    }

    if (state === 'levelclear') {
        levelTimer--;
        if (levelTimer <= 0) nextLevel();
        drawLevelClear();
    }

    for (let i = 0; i < 4; i++) drawGhost(ghosts[i]);
    drawPac();
    drawLives();

    if (state === 'gameover') drawGameOver();
}

buildMaze();
updateUI();
loop();
</script>
</body>
</html>
